<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<title>修仙地牢 · 炼道斩妖录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:#04030a;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;
}
#wrap{
  position:relative;
  display:inline-block;
}
canvas{
  display:block;
  box-shadow:
    0 0 40px  rgba(140,60,255,.45),
    0 0 100px rgba(60,140,255,.20),
    0 0 200px rgba(100,40,180,.12);
}
/* ── HUD overlay（全部是 canvas 绘制，这里仅保留提示文案） ── */
#tip{
  position:absolute;bottom:8px;right:12px;
  font-size:11px;color:rgba(180,140,255,.45);
  pointer-events:none;letter-spacing:.06em;
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="900" height="540"></canvas>
  <div id="tip">WASD 移动 · 自动攻击 · 清空房间获得强化</div>
</div>
<script src="game.js"></script>
</body>
</html>
